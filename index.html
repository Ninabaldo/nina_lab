<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nina's Lab — small digital experiments made with IA by Nina Baldó." />
    <meta name="theme-color" content="#f5f2eb" />
    <title>Nina's Lab</title>
    <script>
      (function () {
        var theme = localStorage.getItem('nina-lab-theme') || localStorage.getItem('breathe-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.dataset.theme = 'dark';
        }
        var lang = localStorage.getItem('nina-lab-language') || localStorage.getItem('breathe-language');
        if (lang) document.documentElement.lang = lang;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
